<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0416"/>
      <stop offset="50%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0a0416"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Фон -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Декоративная рамка -->
  <rect x="40" y="40" width="1120" height="550" rx="32"
        fill="none" stroke="#7c3aed" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Иконка меча -->
  <text x="100" y="180" font-size="96" font-family="system-ui, sans-serif">⚔️</text>

  <!-- Заголовок AI-Приключение -->
  <text x="220" y="170" font-size="72" font-weight="800"
        font-family="system-ui, -apple-system, sans-serif" fill="#e8e3f5">
    AI-<tspan fill="#a78bfa">Приключение</tspan>
  </text>

  <!-- Подзаголовок -->
  <text x="220" y="230" font-size="26" font-weight="500"
        font-family="system-ui, -apple-system, sans-serif" fill="#a89bc5">
    RPG с нейросетью в Telegram
  </text>

  <!-- Разделительная полоса -->
  <line x1="220" y1="280" x2="1120" y2="280"
        stroke="#7c3aed" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Основной тезис -->
  <text x="100" y="380" font-size="52" font-weight="800"
        font-family="system-ui, -apple-system, sans-serif" fill="#e8e3f5">
    Пиши свою историю.
  </text>
  <text x="100" y="450" font-size="52" font-weight="800"
        font-family="system-ui, -apple-system, sans-serif" fill="url(#accent)">
    ИИ ведёт сюжет.
  </text>

  <!-- Фичи-строки -->
  <text x="100" y="530" font-size="24"
        font-family="system-ui, -apple-system, sans-serif" fill="#a89bc5">
    🗺️ 12 локаций    🐉 Боссы    🏛️ Гильдии    🏆 Сезоны
  </text>

  <!-- Нижняя плашка CTA -->
  <rect x="820" y="500" width="300" height="60" rx="14"
        fill="#7c3aed" fill-opacity="0.9"/>
  <text x="970" y="538" font-size="22" font-weight="700" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif" fill="#ffffff">
    Играть бесплатно
  </text>

  <!-- Бейдж 18+ -->
  <rect x="1000" y="80" width="120" height="50" rx="25"
        fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-opacity="0.5"/>
  <text x="1060" y="113" font-size="20" font-weight="700" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif" fill="#b9a3f5">
    18+
  </text>
</svg>
